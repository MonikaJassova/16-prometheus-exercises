apiVersion: v1
kind: Secret
metadata:
  name: rocketchat-auth
  namespace: monitoring
type: Opaque
# Values are generated from the Rocket.Chat API (PAT + admin userId) and applied
# directly to the cluster; they are never stored in the repo.
#   token    - personal access token (chat.postMessage permission)
#   token_id - the admin userId bound to that token
# api_url is not a secret: the AlertmanagerConfig references the in-cluster
# service http://rocketchat-rocketchat.monitoring.svc:80 as a plain string.
stringData:
  token: CHANGE_ME
  token_id: CHANGE_ME
